name: Build FNF Chart Editor

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            script: build-windows.bat
          - os: ubuntu-latest
            name: linux
            script: build-linux-app.sh
          - os: macos-latest
            name: macos
            script: ./build-macos.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        shell: bash
        run: ${{ matrix.script }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Chart-Editor-${{ matrix.name }}
          path: release/
